<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validaton</title>
    <link rel="stylesheet" href="./Formvalidation.css">
</head>

<body>
    <div class="container">
        <h2>Register For Internship </h2>
        <form onsubmit="return ValidateForm()">
            <p><label>Name : </label><input type="text" id="name" placeholder="Enter Your Name"><br>
                <span id="nameError"></span><br>
            </p>
            <p>
                <label>Email : </label><input type="email" id="email" placeholder="Enter your Mail Id"><br>
                <span id="emailError"></span><br>
            </p>
            <p><label>Phone Number : </label><input type="tel" id="pnumber" placeholder="Enter phone number"><br>
                <span id="phoneError"></span><br>
            </p>
            <p><label>Password : </label><input type="password" id="pass" placeholder="Enter Your password"><br>
                <span id="passError"></span><br>
            </p>
            <p><label>Confirm Password : </label><input type="password" id="cpass" placeholder="Re-enter your password"><br>
                <span id="cpassError"></span><br>
            </p>
            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="./Formvalidation.js"></script>
</body>

</html>
